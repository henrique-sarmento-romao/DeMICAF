[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "DeMICAF"
version = "0.0.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = "==3.13.*"
dependencies = [
  "icecream>=2.2.0",
  "ipywidgets>=8.1.8",
  "numba>=0.61",
  "pyiqa>=0.1.16",
  "pyyaml>=6.0.2",
]
# description = "description of the project"
# authors = [{ name = "" }]
# license = { file = "LICENSE" }
# keywords = ["keyword1", "keyword2"]
# classifiers = [
#   "Intended Audience :: Developers",
#   "Intended Audience :: Science/Research",
#   "Programming Language :: Python :: 3",
#   "Programming Language :: Python :: 3.11",
#   "Topic :: Scientific/Engineering :: Artificial Intelligence",
# ]

# [project.urls]
# Documentation = "https://link.to.documentation"

[tool.setuptools.packages.find]
where = ["src"]
include = ["DeMICAF*"]
namespaces = true

[dependency-groups]
dev = [
    "dvc[ssh]",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "openTSNE",
    "nvitop",
    "imageio[ffmpeg]",
    "asttokens",
    "comm",
    "debugpy",
    "decorator",
    "executing",
    "ipykernel",
    "ipython",
    "ipython-pygments-lexers",
    "jedi",
    "jupyter-client",
    "jupyter-core",
    "matplotlib-inline",
    "nest-asyncio",
    "parso",
    "pexpect",
    "ptyprocess",
    "pure-eval",
    "pyzmq",
    "stack-data",
    "tornado",
    "traitlets",
    "transformers",
    "accelerate",
    "huggingface-hub>=1.13.0",
    "typer>=0.16.0",
    "ollama",
    "optuna",
    "ruff==0.11.10",
    "selfclean",
]

[tool.uv]
# selfclean pins `transformers[torch]==4.27.4`, which pulls in a `tokenizers`
# version with no prebuilt wheel for this Python/platform (needs a Rust
# compiler to build from source, unavailable here). The pin is unnecessarily
# strict — selfclean's actual runtime code (verified against its installed
# source, not just its metadata) works fine against the modern `transformers`
# this repo already depends on for pyiqa's qalign metric. Override it so
# `uv sync` resolves cleanly instead of trying to build the old `tokenizers`.
override-dependencies = ["transformers>=4.27.4"]

# [project.scripts]
# script-name = "module:function"

# [tool.setuptools.package-data]
# template = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [ # See https://docs.astral.sh/ruff/rules/
  "F",    # flake8 (pyflakes)
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort
  "N",    # pep8-naming
  "D",    # flake8-docstrings (pydocstyle)
  "UP",   # pyupgrade
  "S",    # flake8-bandit
  "BLE",  # flake8-blind-except
  "FBT",  # flake8-boolean-trap maybe add this
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "T10",  # flake8-debugger (to remove breakpoint())
  "EM",   # flake8-errmsg
  "G",    # flake8-logging-format
  "INP",  # flake8-no-pep420
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "Q",    # flake8-quotes
  "RSE",  # flake8-raise (to remove unused parethesis in raise)
  "RET",  # flake8-return
  "SLF",  # flake8-self
  "SLOT", # flake8-slots (enforce __slots__ for some subclasses)
  "SIM",  # flake8-simplify
  "TID",  # flask8-tidy-imports
  "TCH",  # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "PGH",  # pygrep-hooks (mostly to check for invalid-mock-access)
  "TRY",  # tryceratops
  "NPY",  # numpy-specific rules
  "PERF", # perflint
  "FURB", # refurb
  "LOG",  # flake8-logging
  "RUF",  # ruff-specific rules
]
ignore = [
  "TRY003", # long messages outside exception class — fine for research code
  "EM101",  # string literal in exception
  "EM102",  # f-string in exception
  "S311",   # non-cryptographic random is intentional here
  "FBT001", # boolean positional args — pervasive in plotting/training helpers
  "FBT002",
  "FBT003",
  "N803",   # math notation (T, A, B...) is intentional in scientific code
  "N806",   # same for local variables (D, H, W, K...)
  "N812",   # torch.nn.functional as F is the ecosystem convention
  "RUF001", # math symbols (×, −, σ, –) are intentional in scientific prose
  "RUF002",
  "RUF003",
  "DTZ005", # naive datetime.now() is only used for run-folder timestamps
  "NPY002", # reproducibility relies on the legacy global RNG seeded by set_seed
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "SLF", "INP", "D1"]
"scripts/**/*.py" = ["D1", "S101"]
# matplotlib.use("Agg") must run before pyplot is imported.
"scripts/scoring/score.py" = ["E402"]
"scripts/scoring/generalization.py" = ["E402"]
"scripts/scoring/configuration.py" = ["E402"]
"scripts/benchmarking.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
disable_error_code = ["import-untyped"]
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--cov=DeMICAF -v --cov-report=term-missing --durations=20 --no-cov-on-fail"

[tool.coverage.run]
# Heavy GPU/torch training loops are exercised on the cluster, not in unit tests.
omit = [
  "*/DeMICAF/classifier.py",
  "*/DeMICAF/caf/encoder.py",
  "*/DeMICAF/federated/client.py",
  "*/DeMICAF/federated/server.py",
  "*/DeMICAF/federated/data.py",
]
